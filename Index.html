<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Paletita ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>

<body>

<div id="loader">
    <div class="loader-content">
        <div class="heart-loader">❤️</div>
        <p>Preparando algo especial para ti...</p>
    </div>
</div>

<main class="main-gallery">
<header class="gallery-header">
<h1>Para Paletita</h1>
<p>Hecho con ❤️ por Zelly</p>

<button class="reload-btn" onclick="location.reload()">
<span>↺</span> Recargar Galería
</button>
</header>

<div class="gift-grid">
<div class="gift-card" id="openSorpresa">
<div class="card-background" style="background-image:url('IMAGENES/Ella1.jpg')"></div>
<div class="card-content">
<h2>Sorpresa Paletita</h2>
<p>Nuestra historia</p>
</div>
</div>

<div class="gift-card locked">
<div class="card-content">
<h2>Carta Especial</h2>
<p>Próximamente...</p>
</div>
</div>
</div>
</main>

<div id="sorpresaModal" class="modal-overlay">
<button class="close-modal">&times;</button>

<div class="slides">
<section class="slide intro">
<div class="content">
<h1>Sorpresa Paletita</h1>
<button id="startExperience" class="reload-btn">Comenzar</button>
</div>
</section>

<section class="slide dark">
<div class="content">
<h2>En 2025 conocí a alguien...</h2>
</div>
</section>

<section class="slide photo-slide">
<img src="IMAGENES/Ella1.jpg">
<div class="content">
<h2 class="overlay-text">Y cambió todo mi mundo.</h2>
</div>
</section>

<section class="slide stat">
<div class="content">
<h1 id="daysCounter">0</h1>
<p>Días juntos</p>
</div>
</section>

<section class="slide audio-slide">
<div class="content">
<button id="playAudio" class="reload-btn">▶ Música</button>
<div id="lyrics"></div>
<audio id="audio" src="IMAGENES/Lenguaje_del_Alma.mp3"></audio>
</div>
</section>

</div>
</div>

<script src="script.js"></script>
</body>
</html>
